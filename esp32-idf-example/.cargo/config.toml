[build]
target = "xtensa-esp32-espidf"

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

# Use with the esp toolchain, which overrides rust-toolchain.toml: cargo +esp run-device
[alias]
build-device = "build --release"
run-device = "run --release"
test-host = "test --no-default-features --target x86_64-unknown-linux-gnu"

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.3.3"
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults"
